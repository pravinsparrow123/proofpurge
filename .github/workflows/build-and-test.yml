name: Build & Verify Engine

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore DataLifecycleEngine.slnx

    - name: Build Solution (Release)
      run: dotnet build DataLifecycleEngine.slnx -c Release --no-restore

    - name: Run Test Suite
      run: dotnet test DataLifecycleEngine.slnx -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
